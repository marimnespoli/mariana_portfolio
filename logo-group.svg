<svg preserveAspectRatio="none" width="100%" height="100%" overflow="visible" style="display: block;" viewBox="0 0 259 249.601" fill="none" xmlns="http://www.w3.org/2000/svg">
<g id="Group 14">

  <!--
    Pizza-loader sweep: começa círculo cheio roxo, vai diminuindo até parar na metade esquerda.
    Técnica: stroke grosso (sw = diâmetro → preenche como disco) + stroke-dasharray animado.
    r=62.4, sw=124.8 → preenche exatamente do centro até a borda (vertical).
    rotate(90°) → stroke começa em baixo (6h), vai clockwise: esquerda → topo.
    Ao reduzir para C/2: mostra apenas a metade esquerda ✓
    C = 2π × 62.4 ≈ 392.1
  -->
  <circle
    cx="129.5" cy="124.8" r="62.4"
    fill="none"
    stroke="#BBB5E3"
    stroke-width="124.8"
    stroke-linecap="butt"
    transform="rotate(90, 129.5, 124.8)"
    stroke-dasharray="392.1 0">
    <animate
      attributeName="stroke-dasharray"
      from="392.1 0"
      to="196.1 392.1"
      dur="3.5s"
      begin="0.2s"
      calcMode="spline"
      keySplines="0.4 0 0.2 1"
      fill="freeze"/>
  </circle>

