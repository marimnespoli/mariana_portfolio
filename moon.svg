<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="moonGrad" cx="60%" cy="35%" r="60%">
      <stop offset="0%"   stop-color="#fffde0"/>
      <stop offset="60%"  stop-color="#f5e98a"/>
      <stop offset="100%" stop-color="#e8d870"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- glow -->
  <circle cx="165" cy="148" r="80" fill="#f5e98a" opacity="0.18" filter="url(#soft)"/>

  <!-- crescent: big circle minus offset circle -->
  <circle cx="165" cy="150" r="90" fill="url(#moonGrad)"/>
  <!-- cutout circle (white) to create crescent -->
  <circle cx="130" cy="138" r="80" fill="white"/>
</svg>
