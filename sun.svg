<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <filter id="wc" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="coreGrad" cx="45%" cy="40%" r="55%">
      <stop offset="0%"   stop-color="#fff0a0"/>
      <stop offset="35%"  stop-color="#ffcc00"/>
      <stop offset="70%"  stop-color="#ff9900"/>
      <stop offset="100%" stop-color="#e06000"/>
    </radialGradient>
    <linearGradient id="rayGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%"   stop-color="#ff8800"/>
      <stop offset="40%"  stop-color="#ffbb00"/>
      <stop offset="100%" stop-color="#ffe033" stop-opacity="0.65"/>
    </linearGradient>
  </defs>

  <!-- RAYS — rotate slowly -->
  <g transform="translate(150,150)" filter="url(#wc)">
    <animateTransform attributeName="transform" attributeType="XML"
      type="rotate" from="0 0 0" to="360 0 0"
      dur="18s" repeatCount="indefinite" additive="sum"/>
    <polygon points="0,-70 -9,-96 9,-96"   fill="url(#rayGrad)" transform="rotate(0)"/>
    <polygon points="0,-70 -7,-88 7,-88"   fill="url(#rayGrad)" transform="rotate(20)"  opacity="0.85"/>
    <polygon points="0,-70 -9,-98 9,-98"   fill="url(#rayGrad)" transform="rotate(40)"/>
    <polygon points="0,-70 -7,-87 7,-87"   fill="url(#rayGrad)" transform="rotate(60)"  opacity="0.85"/>
    <polygon points="0,-70 -9,-96 9,-96"   fill="url(#rayGrad)" transform="rotate(80)"/>
    <polygon points="0,-70 -7,-88 7,-88"   fill="url(#rayGrad)" transform="rotate(100)" opacity="0.85"/>
    <polygon points="0,-70 -9,-100 9,-100" fill="url(#rayGrad)" transform="rotate(120)"/>
    <polygon points="0,-70 -7,-86 7,-86"   fill="url(#rayGrad)" transform="rotate(140)" opacity="0.85"/>
    <polygon points="0,-70 -9,-96 9,-96"   fill="url(#rayGrad)" transform="rotate(160)"/>
    <polygon points="0,-70 -7,-88 7,-88"   fill="url(#rayGrad)" transform="rotate(180)" opacity="0.85"/>
    <polygon points="0,-70 -9,-98 9,-98"   fill="url(#rayGrad)" transform="rotate(200)"/>
    <polygon points="0,-70 -7,-86 7,-86"   fill="url(#rayGrad)" transform="rotate(220)" opacity="0.85"/>
    <polygon points="0,-70 -9,-96 9,-96"   fill="url(#rayGrad)" transform="rotate(240)"/>
    <polygon points="0,-70 -7,-89 7,-89"   fill="url(#rayGrad)" transform="rotate(260)" opacity="0.85"/>
    <polygon points="0,-70 -9,-98 9,-98"   fill="url(#rayGrad)" transform="rotate(280)"/>
    <polygon points="0,-70 -7,-87 7,-87"   fill="url(#rayGrad)" transform="rotate(300)" opacity="0.85"/>
    <polygon points="0,-70 -9,-96 9,-96"   fill="url(#rayGrad)" transform="rotate(320)"/>
    <polygon points="0,-70 -7,-88 7,-88"   fill="url(#rayGrad)" transform="rotate(340)" opacity="0.85"/>
  </g>

  <!-- white ring — static -->
  <circle cx="150" cy="150" r="70" fill="white"/>

  <!-- core — static -->
  <circle cx="150" cy="150" r="66" fill="url(#coreGrad)" filter="url(#wc)"/>

  <!-- highlight -->
  <circle cx="136" cy="133" r="20" fill="white" opacity="0.15"/>
</svg>
